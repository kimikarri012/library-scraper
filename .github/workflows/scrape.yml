name: Library Event Scraper

on:
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday morning
  workflow_dispatch: # Adds a manual "Run" button

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper
        run: python scraper.py

      - name: Commit Updated Calendar File
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add toddler_events.ics
          git commit -m "Auto-update library calendar" || exit 0
          git push
